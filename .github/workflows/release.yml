name: Release

# A tag publishes hex as pinned release assets: the two stylesheets, the fonts
# bundle and the licence. A host fetches the tag it pinned and nothing floats.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the fonts
        run: tar czf fonts.tar.gz fonts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" tokens.css fonts.css fonts.tar.gz LICENSE --generate-notes